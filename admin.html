<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>THE APP — Private Admin</title><link rel="stylesheet" href="style.css"></head><body class="admin-body"><main class="admin-shell"><section id="admin-login" class="admin-login"><span class="eyebrow">THE APP / PRIVATE</span><h1>Admin access</h1><p>Sign in to review business applications.</p><form id="admin-login-form"><label>Email<input id="admin-email" type="email" required autocomplete="email"></label><label>Password<input id="admin-password" type="password" required autocomplete="current-password"></label><button class="primary" type="submit">Sign in →</button><p id="admin-login-message" class="admin-message" hidden></p></form></section><section id="admin-app" hidden><header class="admin-header"><div><span class="eyebrow">THE APP / PRIVATE</span><h1>Business review</h1><p>Review applications before they become discoverable.</p></div><button id="admin-logout" class="filter-button">Log out</button></header><section class="admin-stats"><div><strong id="pending-count">0</strong><span>Pending</span></div><div><strong id="approved-count">0</strong><span>Approved</span></div><div><strong id="info-count">0</strong><span>Needs info</span></div></section><p id="admin-app-message" class="admin-message" hidden></p><section class="admin-layout"><aside class="application-list" id="application-list"></aside><article class="application-detail" id="application-detail"><div class="empty-detail"><h2>Select an application</h2><p>Choose a business to review.</p></div></article></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script></body></html>
