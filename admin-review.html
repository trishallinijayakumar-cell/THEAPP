<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#ff6500"><title>Found It — Admin Review</title><link rel="stylesheet" href="style.css"><style>.admin-body{background:#f8f8f6}.admin-shell{width:min(1180px,100%);margin:auto;padding:28px}.admin-login{max-width:520px;margin:8vh auto}.admin-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding:10px 0 24px}.admin-header h1{font-size:clamp(2.4rem,5vw,4rem);line-height:.95;letter-spacing:-.05em;margin:5px 0 10px}.admin-header p{color:var(--muted)}.admin-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}.admin-stats>div{background:#fff;border:1px solid #eee;border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}.admin-stats strong,.admin-stats span{display:block}.admin-stats strong{font-size:2rem;color:var(--orange)}.admin-stats span{font-size:.78rem;color:var(--muted);font-weight:700}.admin-tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.admin-layout{display:grid;grid-template-columns:340px 1fr;gap:14px;align-items:start}.application-list,.application-detail{background:#fff;border:1px solid #eee;border-radius:20px;box-shadow:var(--shadow)}.application-list{padding:8px;max-height:68vh;overflow:auto}.application-item{width:100%;display:block;text-align:left;background:#fff;border:1px solid transparent;border-radius:14px;padding:15px;margin:0 0 5px;color:var(--text)}.application-item:hover,.application-item.selected{border-color:var(--orange-line);background:var(--orange-soft)}.application-item strong,.application-item small{display:block}.application-item strong{margin:7px 0 4px}.application-item small{color:var(--muted);font-size:.75rem}.application-status{display:inline-block;border-radius:999px;padding:5px 9px;font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;background:#eee;color:#555}.application-status.pending{background:var(--orange-soft);color:var(--orange)}.application-status.approved{background:#eaf7ee;color:#287a43}.application-status.needs_info{background:#fff8df;color:#876800}.application-status.rejected{background:#fcecec;color:#a33}.application-detail{padding:28px;min-height:420px}.detail-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:25px}.detail-head h2{font-size:2rem;letter-spacing:-.04em}.detail-head p{color:var(--muted);font-size:.8rem;margin-top:5px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.detail-grid>div,.documents,.admin-note{border-top:1px solid #eee;padding-top:15px}.detail-grid h4,.documents h4,.admin-note h4{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}.detail-grid p,.admin-note p{color:var(--muted);line-height:1.55;word-break:break-word}.documents{margin-top:22px}.documents>div{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.admin-note{margin-top:22px}.review-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:26px;align-items:center}.reject{color:#a33}.empty-list,.empty-detail{padding:30px;color:var(--muted)}.form-message,.admin-message{padding:11px 13px;border-radius:12px;background:var(--orange-soft);color:var(--text);font-size:.82rem}.form-message.error,.admin-message.error{background:#fcecec;color:#a33}.muted{color:var(--muted)}@media(max-width:760px){.admin-shell{padding:16px}.admin-layout{grid-template-columns:1fr}.application-list{max-height:38vh}.detail-grid{grid-template-columns:1fr}.admin-stats{grid-template-columns:1fr 1fr 1fr}.detail-head{flex-direction:column}}</style></head><body class="admin-body"><main class="admin-shell"><section id="admin-login" class="admin-login center-card"><span class="eyebrow">FOUND IT / PRIVATE</span><h1>Review businesses.</h1><p>Sign in with an email that has been added to the Found It admin list.</p><form id="admin-login-form"><label>Email<input id="admin-email" type="email" required autocomplete="email" placeholder="admin@example.com"></label><label>Password<input id="admin-password" type="password" required autocomplete="current-password" placeholder="Your password"></label><button class="primary" type="submit">Sign in <span>→</span></button><p id="admin-login-message" class="admin-message" hidden></p></form></section><section id="admin-app" hidden><header class="admin-header"><div><span class="eyebrow">FOUND IT / PRIVATE</span><h1>Business review</h1><p>Review applications before they become discoverable.</p></div><button id="admin-logout" class="filter-button">Log out</button></header><section class="admin-stats"><div><strong id="pending-count">0</strong><span>Pending</span></div><div><strong id="approved-count">0</strong><span>Approved</span></div><div><strong id="info-count">0</strong><span>Needs info</span></div></section><nav class="admin-tabs"><button class="filter active" data-admin-status="pending">Pending</button><button class="filter" data-admin-status="needs_info">Needs info</button><button class="filter" data-admin-status="approved">Approved</button><button class="filter" data-admin-status="rejected">Rejected</button></nav><p id="admin-app-message" class="admin-message" hidden></p><section class="admin-layout"><aside class="application-list" id="application-list"></aside><article class="application-detail" id="application-detail"><div class="empty-detail"><h2>Select an application</h2><p>Choose a business to review.</p></div></article></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20260908"></script><script src="found-it-admin.js?v=20260908"></script></body></html>
